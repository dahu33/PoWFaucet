name: Build docker image for latest release

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - "test"

jobs:
  build_docker:
    name: Build and Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get project versions
        id: version
        run: |
          echo "server_version=$(jq -r ".version" package.json)" >> $GITHUB_ENV
          echo "client_version=$(jq -r ".version" faucet-client/package.json)" >> $GITHUB_ENV

      - name: Build and push multi-arch images
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile \
            --tag pk910/powfaucet:v${{ env.server_version }} \
            --tag pk910/powfaucet:v2-stable \
            .
            # --push .
